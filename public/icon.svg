<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070d" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Neon Ring (Stadium Arena Boundary) -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-dasharray="16 10" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Rotating Blade Accents -->
  <path d="M 256 66 L 268 120 L 244 120 Z" fill="#00f3ff" />
  <path d="M 256 446 L 268 392 L 244 392 Z" fill="#00f3ff" />
  <path d="M 66 256 L 120 244 L 120 268 Z" fill="#ff007a" />
  <path d="M 446 256 L 392 244 L 392 268 Z" fill="#ff007a" />

  <!-- Central Battle Arena Glow -->
  <circle cx="256" cy="256" r="140" fill="#0f172a" stroke="url(#neonPink)" stroke-width="6" />

  <!-- Center Shield / Door Hazard -->
  <circle cx="256" cy="256" r="54" fill="#1e1b4b" stroke="#38bdf8" stroke-width="4" />
  <circle cx="256" cy="256" r="32" fill="#ff007a" opacity="0.85" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="16" fill="#ffffff" />

  <!-- Crossed Battle Swords / Trophies -->
  <path d="M 190 200 L 322 312 M 200 190 L 312 322" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 322 200 L 190 312 M 312 190 L 200 322" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Live Stream Flag Orbs inside Safe Zone -->
  <circle cx="200" cy="150" r="22" fill="#ff4d4d" stroke="#ffffff" stroke-width="3" />
  <circle cx="312" cy="150" r="22" fill="#10b981" stroke="#ffffff" stroke-width="3" />
  <circle cx="160" cy="256" r="20" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />
  <circle cx="352" cy="256" r="20" fill="#f59e0b" stroke="#ffffff" stroke-width="3" />
  <circle cx="256" cy="350" r="22" fill="#8b5cf6" stroke="#ffffff" stroke-width="3" />

  <!-- Text Header -->
  <text x="256" y="90" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="900" fill="#00f3ff" letter-spacing="4">RESPAWN TAHMID</text>
  <text x="256" y="420" text-anchor="middle" font-family="Oswald, Impact, sans-serif" font-size="28" font-weight="900" fill="#fbbf24" letter-spacing="3">FLAGS BATTLE</text>
</svg>
